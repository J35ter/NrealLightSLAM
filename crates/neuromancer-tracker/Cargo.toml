[package]
name = "neuromancer-tracker"
description = "Nreal Light head tracker (minimal IMU core): USB IMU -> Mahony AHRS -> HUD/UDP. Main tracker; no visual/VO code linked"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neuromancer-ahrs = { path = "../neuromancer-ahrs" }
ar-drivers = { path = "../../vendor/ar-drivers" }
# SIGINT handling (blocking USB read interrupt).
libc = "0.2"
# Settings file (TOML) shared with the GUI.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
# hid_probe example: enumerate/open the Nreal HID devices (debugging only).
hidapi = "2.4"
