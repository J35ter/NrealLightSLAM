[package]
edition = "2021"
name = "ar-drivers"
version = "0.4.3"
authors = ["Alex Badics <admin@stickman.hu>"]
description = "Opensource driver for Rokid, Nreal and some other AR glasses"
documentation = "https://docs.rs/ar-drivers"
readme = "README.md"
keywords = [
    "rokid",
    "ar",
]
categories = ["hardware-support"]
license = "MIT"
repository = "https://github.com/badicsalex/ar-drivers-rs"

[dependencies.bytemuck]
version = "1.13.1"
optional = true

[dependencies.byteorder]
version = "1.4"

[dependencies.nalgebra]
version = "0.32.3"
features = ["std"]
default-features = false

[dependencies.rusb]
version = "0.9.2"
optional = true

[dependencies.serialport]
version = "4.2"
optional = true

[dependencies.tinyjson]
version = "2.5.1"
optional = true

# NOTE (vendored 2026-08-04): upstream [dev-dependencies] (clap, opencv) and
# examples/ removed — they exist only for upstream's example binaries, and
# the opencv build script fails on this toolchain. We use ar-drivers as a
# library only. See DEVELOPMENT_SPEC.md D.5.

[features]
default = [
    "mad_gaze",
    "rokid",
    "nreal",
    "grawoow",
]
grawoow = [
    "rusb",
    "tinyjson",
    "bytemuck",
]
mad_gaze = ["serialport"]
nreal = [
    "hidapi",
    "tinyjson",
    "bytemuck",
]
rokid = ["rusb"]

[target."cfg(not(target_os = \"android\"))".dependencies.hidapi]
version = "2.4.1"
optional = true

[target."cfg(target_os = \"android\")".dependencies.hidapi]
version = "2.4.1"
features = ["linux-static-libusb"]
optional = true
default-features = false
